name: Keep the database awake

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request the health endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Set the SITE_URL repository variable (Settings > Secrets and variables > Actions > Variables) to the live site address."
            exit 1
          fi
          curl --fail --silent --show-error "$SITE_URL/api/health"
